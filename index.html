(function () {
  var dbp = null;

    if (dbp) return dbp;

        req.onerror = function () { rej(req.error); };
      } catch (e) { rej(e); }
    });
    return dbp;
  }
  function idb(mode, fn) {
    return bukaDb().then(function (db) {
      return new Promise(function (res, rej) {
        var tx = db.transaction("kv", mode);

        r.onerror = function () { rej(r.error); };
      });
    });
  }

})();

// Pola bahasa Indonesia: V, CV, CVC — digraf ng/ny/sy/kh dihitung satu konsonan.
// Bisa dioverride manual dengan tanda hubung: "se-ko-lah"
function pecahSuku(kataRaw) {
  const kata = kataRaw.toLowerCase().trim();
  if (kata.includes("-")) return kata.split("-").filter(Boolean);
  const units = [];
  for (let i = 0; i < kata.length;) {
    const two = kata.slice(i, i + 2);
    if (DIGRAF.includes(two)) {
      units.push(two);
      i += 2;
    } else {
      units.push(kata[i]);
      i += 1;
    }
  }
  const isV = u => u.length === 1 && "aiueo".includes(u);
  const syls = [];
  let cur = [];
  let k = 0;
  while (k < units.length) {
    while (k < units.length && !isV(units[k])) {
      cur.push(units[k]);
      k++;
    }
    if (k >= units.length) {
      if (syls.length) syls[syls.length - 1] += cur.join("");else if (cur.length) syls.push(cur.join(""));
      break;
    }
    cur.push(units[k]);
    k++;
    const cc = [];
    let m = k;
    while (m < units.length && !isV(units[m])) {
      cc.push(units[m]);
      m++;
    }
    if (m >= units.length) {
      cur.push(...cc);
      k = m;
      syls.push(cur.join(""));
      cur = [];
    } else if (cc.length <= 1) {
      syls.push(cur.join(""));
      cur = [];
    } else {
      cur.push(cc[0]);
      k++;
      syls.push(cur.join(""));
      cur = [];
    }
  }
  return syls.filter(Boolean);
}

// Kalau window.SUPABASE_CONFIG terisi (di file HTML), rekaman & data sinkron antar perangkat.

const SB = (() => {
  try {
    const cfg = typeof window !== "undefined" ? window.SUPABASE_CONFIG : null;
    if (cfg?.url && cfg?.anonKey && window.supabase?.createClient) {
      return window.supabase.createClient(cfg.url, cfg.anonKey);
    }
  } catch (e) {}
  return null;
})();
const BUCKET = "suara";
// rekamLokal: true -> file suara SELALU tersimpan di perangkat (tidak diunggah),
// walaupun Supabase aktif untuk kosa kata & poin.
const SUARA_LOKAL = !SB || !!(typeof window !== "undefined" && window.SUPABASE_CONFIG?.rekamLokal);
async function kvGet(key) {
  if (SB) {
    const {
      data
    } = await SB.from("pengaturan").select("value").eq("key", key).maybeSingle();
    return data?.value ?? null;
  }
  try {
    const r = await window.storage.get(key);
    return r?.value ?? null;
  } catch (e) {
    return null;
  }
}
async function kvSet(key, value) {
  if (SB) {
    await SB.from("pengaturan").upsert({
      key,
      value
    });
    return;
  }
  try {
    await window.storage.set(key, value);
  } catch (e) {}
}

// ================= SUARA =================
let audioSrc = {}; // key -> sumber audio siap putar (dataURL lokal / URL publik Supabase)
let fileNames = {}; // key -> nama file di bucket (untuk hapus/timpa)
let recordedKeys = new Set();
async function loadRecordedKeys() {
  if (!SUARA_LOKAL) {
    try {
      const {
        data,
        error
      } = await SB.storage.from(BUCKET).list("", {
        limit: 1000
      });
      if (!error && data) {
        data.forEach(f => {
          const key = f.name.replace(/\.(webm|mp4|bin)$/, "");
          recordedKeys.add(key);
          fileNames[key] = f.name;
          const {
            data: pub
          } = SB.storage.from(BUCKET).getPublicUrl(f.name);
          audioSrc[key] = pub.publicUrl + "?v=" + encodeURIComponent(f.updated_at || "");
        });
      }
    } catch (e) {}
    return;
  }
  try {
    const res = await window.storage.list("snd:");
    (res?.keys || []).forEach(k => recordedKeys.add(k.replace("snd:", "")));
  } catch (e) {/* belum ada rekaman */}
}
async function getRecording(key) {
  if (audioSrc[key]) return audioSrc[key];
  if (!recordedKeys.has(key)) return null;
  if (!SUARA_LOKAL) return null; // dengan cloud, src sudah terisi saat loadRecordedKeys
  try {
    const r = await window.storage.get("snd:" + key);
    if (r?.value) {
      audioSrc[key] = r.value;
      return r.value;
    }
  } catch (e) {}
  return null;
}
let cachedVoices = {};
function getVoice(lang = "id-ID") {
  if (cachedVoices[lang]) return cachedVoices[lang];
  const voices = window.speechSynthesis?.getVoices?.() || [];
  const pre = lang.split("-")[0];
  cachedVoices[lang] = voices.find(v => v.lang === lang) || voices.find(v => v.lang?.startsWith(pre)) || null;
  return cachedVoices[lang];
}
function playUrl(url) {
  return new Promise(res => {
    const a = new Audio(url);
    a.onended = res;
    a.onerror = res;
    a.play().catch(res);
  });
}
function speakAsync(text, rate = 0.8, lang = "id-ID") {
  return new Promise(res => {
    if (!window.speechSynthesis) return res();
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang;
    u.rate = rate;
    u.pitch = 1.1;
    const v = getVoice(lang);
    if (v) u.voice = v;
    u.onend = res;
    u.onerror = res;
    window.speechSynthesis.speak(u);
    setTimeout(res, 5000);
  });
}
async function play(key, fallbackText, rate, lang) {
  const url = await getRecording(key);
  if (url) return playUrl(url);
  return speakAsync(fallbackText ?? key, rate, lang);
}
async function playSeq(items, gap = 280) {
  for (const it of items) {
    await play(it.key, it.fb, it.rate, it.lang);
    await new Promise(r => setTimeout(r, gap));
  }
}

function tglHariIni() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function tglKemarin() {
  const d = new Date();
  d.setDate(d.getDate() - 1);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
const BONUS_HARIAN = 5;
async function muatPoin() {
  try {
    const v = await kvGet("poin-data");
    if (v) return JSON.parse(v);
  } catch (e) {}
  return {
    total: 0,
    lastDate: null,
    streak: 0
  };
}
async function tambahPoin(poin, skor) {
  const hariIni = tglHariIni();
  const pertamaHariIni = poin.lastDate !== hariIni;
  const streak = pertamaHariIni ? poin.lastDate === tglKemarin() ? poin.streak + 1 : 1 : poin.streak;
  const dapat = skor + (pertamaHariIni ? BONUS_HARIAN : 0);
  const baru = {
    total: poin.total + dapat,
    lastDate: hariIni,
    streak
  };
  try {
    await kvSet("poin-data", JSON.stringify(baru));
  } catch (e) {}
  return {
    baru,
    dapat,
    bonusHarian: pertamaHariIni
  };
}
